<body>
<main class="app">
  <section class="hero">
    <h1>Sigma Physical Laboratory Generator</h1>
    <p>One approved tracker. Two simple views: issued results for management and a ready-to-print daily work sheet for the technician.</p>
  </section>
  <section class="panel">
    <div class="mode-tabs">
      <button id="resultsMode" class="mode-tab active" type="button">Issued Results<small>Manager view</small></button>
      <button id="dailyMode" class="mode-tab" type="button">Daily Work Sheet<small>Technician view</small></button>
    </div>
    <div class="controls">
      <div class="field"><label for="file">Approved tracker (.xlsx)</label><input id="file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></div>
    <div class="field"><label id="dateLabel" for="date">Results date</label><input id="date" type="date" disabled></div>
      <button id="show" class="primary" disabled>Show results</button>
    </div>
    <div id="dailyOptions" class="daily-options hidden">
      <label class="overdue-choice"><input id="includeOverdue" type="checkbox" checked><span>Include overdue items<small>When selected, overdue breaks are listed first. Uncheck for today's breaks only.</small></span></label>
    </div>
    <div id="status" class="status">Select <b>cement_physical_lab_tracker</b> to start.</div>
  </section>

  <section id="report" class="report hidden">
    <div id="reportTitle" class="report-title">PHYSICAL TEST RESULTS - SMART LAST-3 COMPARISON</div>
    <div id="compactBox" class="table-wrap"></div>
  </section>
  <section id="dailyReport" class="daily-report hidden"></section>
  <div id="actions" class="actions hidden"><button id="excel" class="primary">Export Excel</button><button id="pdf" class="secondary">Print / Save PDF</button></div>
</main>
<script>
"use strict";
const $=s=>document.querySelector(s),te=new TextEncoder(),td=new TextDecoder();
let loaded=null,current=null,activeMode="results";
const finite=v=>typeof v==="number"&&Number.isFinite(v);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function xmlEncode(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function xmlDecode(v){return String(v??"").replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(+n)).replace(/&#x([0-9a-f]+);/gi,(_,n)=>String.fromCharCode(parseInt(n,16))).replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&")}
function colOf(ref){return (String(ref).match(/[A-Z]+/)||[""])[0]}
function colName(n){let s="";while(n){n--;s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)}return s}
function bytes(s){return te.encode(s)}
function joinBytes(parts){const n=parts.reduce((s,p)=>s+p.length,0),o=new Uint8Array(n);let k=0;for(const p of parts){o.set(p,k);k+=p.length}return o}
function dateKey(v){if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);if(finite(v)){const ms=Date.UTC(1899,11,30)+Math.round(v)*86400000;return new Date(ms).toISOString().slice(0,10)}const s=String(v??"").trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const d=new Date(s);return isNaN(d)?"":d.toISOString().slice(0,10)}
function arDate(s){return displayDate(s)}
function displayDate(s){if(!s)return"-";const [y,m,d]=s.split("-"),months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return`${d}-${months[Number(m)-1]}-${y}`}
function clean(v){return String(v??"").trim().replace(/\s+/g," ")}
function safeFile(v){return String(v).replace(/[\\/:*?"<>|]+/g,"_").replace(/\s+/g,"_")}
function setStatus(t,error=false){const e=$("#status");e.innerHTML=t;e.classList.toggle("error",error)}
function localToday(){const d=new Date(),p=n=>String(n).padStart(2,"0");return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function timeFraction(v){if(finite(v))return((v%1)+1)%1;const s=clean(v);let m=s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?$/i);if(!m)return null;let h=Number(m[1]),min=Number(m[2]),sec=Number(m[3]||0),ap=(m[4]||"").toUpperCase();if(ap){if(h===12)h=0;if(ap==="PM")h+=12}if(h>23||min>59||sec>59)return null;return(h*3600+min*60+sec)/86400}
function dayMs(day){return Date.parse(day+"T00:00:00Z")}
function dayFromMs(ms){return new Date(ms).toISOString().slice(0,10)}
function addDays(day,n){return dayFromMs(dayMs(day)+n*86400000)}
function combineDateTime(day,time){return day&&time!==null?dayMs(day)+Math.round(time*86400000):null}
function clock(ms){if(ms===null||!Number.isFinite(ms))return"-";const d=new Date(ms),p=n=>String(n).padStart(2,"0");return`${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`}
function dateClock(ms){return ms===null||!Number.isFinite(ms)?"-":`${displayDate(dayFromMs(ms))} ${clock(ms)}`}
function sameOrBefore(a,b){return a&&b&&a<=b}

class ZipReader{
  constructor(buffer){this.buffer=buffer;this.view=new DataView(buffer);this.entries=new Map();this.parse()}
  u16(o){return this.view.getUint16(o,true)} u32(o){return this.view.getUint32(o,true)}
  parse(){let e=-1;for(let i=this.buffer.byteLength-22;i>=Math.max(0,this.buffer.byteLength-65557);i--){if(this.u32(i)===0x06054b50){e=i;break}}if(e<0)throw Error("The selected file is not a valid XLSX file");const count=this.u16(e+10),start=this.u32(e+16);let p=start;for(let i=0;i<count;i++){if(this.u32(p)!==0x02014b50)throw Error("Could not read the XLSX directory");const method=this.u16(p+10),cs=this.u32(p+20),nl=this.u16(p+28),el=this.u16(p+30),cl=this.u16(p+32),lo=this.u32(p+42),name=td.decode(new Uint8Array(this.buffer,p+46,nl));this.entries.set(name,{method,cs,lo});p+=46+nl+el+cl}}
  async getBytes(name){const e=this.entries.get(name);if(!e)throw Error(`Missing workbook part: ${name}`);const nl=this.u16(e.lo+26),el=this.u16(e.lo+28),start=e.lo+30+nl+el,input=new Uint8Array(this.buffer,start,e.cs);if(e.method===0)return new Uint8Array(input);if(e.method===8){const stream=new Blob([input]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return new Uint8Array(await new Response(stream).arrayBuffer())}throw Error(`Unsupported ZIP compression: ${e.method}`)}
  async text(name){return td.decode(await this.getBytes(name))}
}
function sharedStrings(xml){if(!xml)return[];const out=[];let m;const re=/<(?:[\w-]+:)?si\b[^>]*>([\s\S]*?)<\/(?:[\w-]+:)?si>/g;while((m=re.exec(xml))){let t="",q;const tr=/<(?:[\w-]+:)?t\b[^>]*>([\s\S]*?)<\/(?:[\w-]+:)?t>/g;while((q=tr.exec(m[1])))t+=xmlDecode(q[1]);out.push(t)}return out}
function parseCells(inner,shared){const out={};let m;const re=/<(?:[\w-]+:)?c\b([^>]*?\br="([A-Z]+\d+)"[^>]*?)(?:\s*\/>|>([\s\S]*?)<\/(?:[\w-]+:)?c>)/g;while((m=re.exec(inner))){const attrs=m[1],ref=m[2],body=m[3];if(body===undefined)continue;const type=(attrs.match(/\bt="([^"]+)"/)||[])[1];let value=null;if(type==="inlineStr"){let q,t="";const tr=/<(?:[\w-]+:)?t\b[^>]*>([\s\S]*?)<\/(?:[\w-]+:)?t>/g;while((q=tr.exec(body)))t+=xmlDecode(q[1]);value=t}else{const vm=body.match(/<(?:[\w-]+:)?v>([\s\S]*?)<\/(?:[\w-]+:)?v>/);if(!vm)continue;const raw=xmlDecode(vm[1]);if(type==="s")value=shared[Number(raw)]??"";else if(type==="str")value=raw;else{const n=Number(raw);value=Number.isFinite(n)?n:raw}}out[colOf(ref)]=value}return out}
function parseRows(xml,shared,fn){let m;const re=/<(?:[\w-]+:)?row\b[^>]*\br="(\d+)"[^>]*>([\s\S]*?)<\/(?:[\w-]+:)?row>/g;while((m=re.exec(xml)))fn(Number(m[1]),parseCells(m[2],shared))}
function attrValue(s,name){const m=String(s).match(new RegExp(`(?:^|\\s)${name.replace(":","\\:")}="([^"]*)"`));return m?xmlDecode(m[1]):""}
function workbookSheetPaths(workbookXml,relsXml){const rels={},paths={};let m;const rr=/<(?:[\w-]+:)?Relationship\b([^>]*)\/>/g;while((m=rr.exec(relsXml))){const id=attrValue(m[1],"Id"),target=attrValue(m[1],"Target"),type=attrValue(m[1],"Type");if(id&&target&&/worksheet$/.test(type)){let path=target.startsWith("/")?target.replace(/^\/+/,""):"xl/"+target;rels[id]=path.replace(/^xl\/xl\//,"xl/")}}const sr=/<(?:[\w-]+:)?sheet\b([^>]*)\/>/g;while((m=sr.exec(workbookXml))){const name=attrValue(m[1],"name"),id=attrValue(m[1],"r:id");if(name&&rels[id])paths[name]=rels[id]}return paths}

async function loadSource(file){
  const zip=new ZipReader(await file.arrayBuffer()),shared=sharedStrings(zip.entries.has("xl/sharedStrings.xml")?await zip.text("xl/sharedStrings.xml"):"");
  const wb=await zip.text("xl/workbook.xml"),rels=await zip.text("xl/_rels/workbook.xml.rels"),paths=workbookSheetPaths(wb,rels);
  const path=paths["Daily Tracker"];if(!path)throw Error("Daily Tracker sheet was not found. Use the approved tracker without renaming the sheet");
  const records=[];parseRows(await zip.text(path),shared,(rn,c)=>{
    if(rn<43)return;
    const hasData=c.B||c.C||c.J||c.K||c.N||c.Q||c.AF;if(!hasData)return;
    records.push({
      row:rn,log:clean(c.A)||String(rn),sampleDate:dateKey(c.B),product:clean(c.C),source:clean(c.F),qc:clean(c.H),rnd:clean(c.I),sampleId:clean(c.J),
      break2:dateKey(c.K),strength2:finite(c.L)?c.L:null,strength2Raw:c.L,castingDate:dateKey(c.M),break7:dateKey(c.N),strength7:finite(c.O)?c.O:null,strength7Raw:c.O,
      break28:dateKey(c.Q),strength28:finite(c.R)?c.R:null,strength28Raw:c.R,setting:finite(c.AF)?c.AF:null,settingTestDate:dateKey(c.W),
      zeroTime:timeFraction(c.P||c.AI),mouldId:clean(c.T||c.AJ)
    });
  });
  if(!records.length)throw Error("No laboratory records were found from row 43 onward");
  const dates=new Set(),allDates=new Set();for(const r of records){for(const d of[r.sampleDate,r.castingDate,r.break2,r.break7,r.break28,r.settingTestDate])if(d)allDates.add(d);if(r.strength2>0&&r.break2)dates.add(r.break2);if(r.strength7>0&&r.break7)dates.add(r.break7);if(r.strength28>0&&r.break28)dates.add(r.break28);if(r.setting>0&&r.settingTestDate)dates.add(r.settingTestDate)}
  return{records,dates:[...dates].sort(),allDates:[...allDates].sort(),sourceName:file.name};
}
function sampleName(r){return r.sampleId||r.qc||r.rnd||r.source||"Not recorded"}
function productKey(v){return clean(v).toLocaleLowerCase("en")}
function smartComparison(data,item,kind,day){
  const key=productKey(item.product);if(!key||key==="not recorded")return{avg3:null,delta:null,signal:"none",historyCount:0,threshold:kind==="setting"?15:3};
  let history=[];if(kind==="setting"){
    history=data.records.filter(r=>productKey(r.product)===key&&r.setting>0&&r.settingTestDate&&r.settingTestDate<day).map(r=>({date:r.settingTestDate,row:r.row,value:r.setting}));
  }else{
    const fields={"2D":["break2","strength2"],"7D":["break7","strength7"],"28D":["break28","strength28"]}[item.age],dateField=fields[0],valueField=fields[1];
    history=data.records.filter(r=>productKey(r.product)===key&&r[valueField]>0&&r[dateField]&&r[dateField]<day).map(r=>({date:r[dateField],row:r.row,value:r[valueField]}));
  }
  history.sort((a,b)=>b.date.localeCompare(a.date)||b.row-a.row);const last3=history.slice(0,3),threshold=kind==="setting"?15:3;
  if(last3.length<3)return{avg3:null,delta:null,signal:"none",historyCount:last3.length,threshold};
  const avg3=last3.reduce((s,x)=>s+x.value,0)/3,delta=item.result-avg3,signal=delta<=-threshold?"low":delta>=threshold?"high":"normal";
  return{avg3,delta,signal,historyCount:3,threshold};
}
function collectDay(data,day){
  const strengths=[],settings=[];
  for(const r of data.records){
    const base={row:r.row,log:r.log,product:r.product||"Not recorded",sampleId:sampleName(r),sampleDate:r.sampleDate,castingDate:r.castingDate,source:r.source};
    const makeStrength=(age,ageOrder,result,resultDate,priorResults=[])=>({...base,age,ageOrder,result,resultDate,priorResults,isIssued:true});
    const prior2=r.strength2>0&&r.break2?{...base,age:"2D",ageOrder:2,result:r.strength2,resultDate:r.break2,isIssued:false}:null;
    const prior7=r.strength7>0&&r.break7?{...base,age:"7D",ageOrder:7,result:r.strength7,resultDate:r.break7,isIssued:false}:null;

y Physical Work Sheet</dc:title><dc:creator>Sigma QC Generator</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${created}</dcterms:created></cp:coreProperties>`);z.add("docProps/app.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes"><Application>Sigma QC Generator</Application><HeadingPairs><vt:vector size="2" baseType="variant"><vt:variant><vt:lpstr>Worksheets</vt:lpstr></vt:variant><vt:variant><vt:i4>1</vt:i4></vt:variant></vt:vector></HeadingPairs><TitlesOfParts><vt:vector size="1" baseType="lpstr"><vt:lpstr>Daily Work</vt:lpstr></vt:vector></TitlesOfParts></Properties>`);z.add("xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView activeTab="0" firstSheet="0" showSheetTabs="1"/></bookViews><sheets><sheet name="Daily Work" sheetId="1" state="visible" r:id="rId1"/></sheets><calcPr calcMode="auto" fullCalcOnLoad="1" forceFullCalc="1"/></workbook>`);z.add("xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);z.add("xl/styles.xml",stylesXml());z.add("xl/worksheets/sheet1.xml",sheetXml);return z.build()}
function buildDailyWorkbook(c){
  const S={title:1,sub:2,section:3,head:4,body:5,result:6,date:7,cream:8,good:9,note:10,ratio:11,time:12,whole:13},rows=[],merges=[],strengthRows=[],settingRows=[],screenRows=typeof document==="undefined"?[]:[...document.querySelectorAll("#dailyReport [data-strength-row]")],screenSettingRows=typeof document==="undefined"?[]:[...document.querySelectorAll("#dailyReport [data-setting-row]")];
  const mergeRow=(text,style=3)=>{rows.push([xcell(text,style)]);merges.push("A"+rows.length+":Q"+rows.length)};
  const addHeaderNamesRow=()=>{const row=rows.length+1,values=Array(17).fill(null);values[0]=xcell("Technician Name: "+signoff.technician,S.good);values[8]=xcell("Laboratory Manager: "+signoff.manager,S.good);rows.push(values);merges.push("A"+row+":H"+row,"I"+row+":Q"+row)};
  const addSignatureRow=()=>{const row=rows.length+1,values=Array(17).fill(null);values[0]=xcell("Technician Signature / Date: ",S.good);values[8]=xcell("Laboratory Manager Approval / Date: ",S.good);rows.push(values);merges.push("A"+row+":H"+row,"I"+row+":Q"+row)};
  mergeRow("DAILY PHYSICAL LAB WORK SHEET - SIGMA",S.title);
  mergeRow("Date: "+displayDate(c.day)+" | Demould: "+c.counts.demould+" | 2D: "+c.counts.d2+" | 7D: "+c.counts.d7+" | 28D: "+c.counts.d28+" | Overdue: "+(c.includeOverdue?c.counts.overdue:"excluded"),S.sub);
  addHeaderNamesRow();
  mergeRow("Transfer to the tracker: Setting Test Date, Sample Date, W/C and rounded Initial Setting result. Keep Zero Time and Mould ID (1-10) for scheduling.",S.good);
  rows.push([]);
  mergeRow("1. DEMOULDING",S.section);
  {const row=rows.length+1,h=Array(17).fill(null);h[0]=xcell("Mould",S.head);h[1]=xcell("Log",S.head);h[2]=xcell("Sample / Product",S.head);h[6]=xcell("Casting / Zero Time",S.head);h[8]=xcell("Allowed From-To (20-24 h)",S.head);h[12]=xcell("2D",S.head);h[13]=xcell("7D",S.head);h[14]=xcell("28D",S.head);h[15]=xcell("Actual / Remarks",S.head);rows.push(h);merges.push("C"+row+":F"+row,"G"+row+":H"+row,"I"+row+":L"+row,"P"+row+":Q"+row)}
  if(c.demould.length)c.demould.forEach(r=>{const row=rows.length+1,v=Array(17).fill(null);v[0]=xcell(r.mouldId,S.body);v[1]=xcell(r.log,S.body);v[2]=xcell(productDisplay(r),S.body);v[6]=xcell(displayDate(r.castingDate)+" "+clock(r.zeroMs),S.body);v[8]=xcell("From "+dateClock(r.earliest)+" | To "+dateClock(r.latest),S.body);v[12]=xcell(displayDate(r.break2),S.body);v[13]=xcell(displayDate(r.break7),S.body);v[14]=xcell(displayDate(r.break28),S.body);v[15]=xcell("",S.cream);rows.push(v);merges.push("C"+row+":F"+row,"G"+row+":H"+row,"I"+row+":L"+row,"P"+row+":Q"+row)});else mergeRow("No demoulding task can be scheduled from the recorded data for this date.",S.note);
  rows.push([]);
  mergeRow("2. INITIAL SETTING TIME - OFFICIAL CALCULATION RECORD",S.section);
  {const row=rows.length+1,h=Array(17).fill(null);["No.","Sample / Product",null,null,"Sample Date","Cement (g)","Water (g)","W/C","Setting Start (Water Contact)","Initial Set Clock Time","Elapsed (min)","Rounded Result (5 min)","Remarks"].forEach((x,i)=>{if(x!==null)h[i]=xcell(x,S.head)});rows.push(h);merges.push("B"+row+":D"+row,"M"+row+":Q"+row)}
  for(let i=0;i<6;i++){
    const row=rows.length+1,screen=screenSettingRows[i],sample=screen?.querySelector("[data-setting-sample]")?.value||"",sampleDate=dateKey(screen?.querySelector("[data-setting-date]")?.value||""),cementRaw=screen?.querySelector("[data-setting-cement]")?.value??"500",waterRaw=screen?.querySelector("[data-setting-water]")?.value??"",startRaw=screen?.querySelector("[data-setting-start]")?.value||"",finishRaw=screen?.querySelector("[data-setting-finish]")?.value||"",remarks=screen?.querySelector("[data-setting-remarks]")?.value||"",cement=Number(cementRaw),water=Number(waterRaw),start=timeFraction(startRaw),finish=timeFraction(finishRaw),v=Array(17).fill(null);
    v[0]=xcell(i+1,S.body);v[1]=xcell(sample,S.cream);v[4]=sampleDate?xdate(sampleDate):xcell("",S.date);v[5]=xcell(Number.isFinite(cement)&&cement>0?cement:500,S.cream);v[6]=waterRaw!==""&&Number.isFinite(water)?xcell(water,S.cream):xcell("",S.cream);v[7]=xformula('IF(OR(F'+row+'="",G'+row+'=""),"",G'+row+'/F'+row+')',S.ratio);v[8]=start===null?xcell("",S.time):xcell(start,S.time);v[9]=finish===null?xcell("",S.time):xcell(finish,S.time);v[10]=xformula('IF(OR(I'+row+'="",J'+row+'=""),"",MOD(J'+row+'-I'+row+',1)*1440)',S.whole);v[11]=xformula('IF(K'+row+'="","",ROUND(K'+row+'/5,0)*5)',S.whole);v[12]=xcell(remarks,S.cream);rows.push(v);settingRows.push(row);merges.push("B"+row+":D"+row,"M"+row+":Q"+row);
  }
  rows.push([]);
  mergeRow("3. STRENGTH BREAK SCHEDULE",S.section);
  rows.push(["Due Status","Age","Log","Sample / Product","Mould","Earlier Age Averages","Target & Allowed Window","R1","R2","R3","R4","R5","R6","EN Average (MPa)","QC Status","Actual Time","Remarks"].map(x=>xcell(x,S.head)));
  if(c.breaks.length)c.breaks.forEach((r,breakIndex)=>{
    const row=rows.length+1,range="H"+row+":M"+row,q="R"+row,rr="S"+row,s="T"+row,t="U"+row,u="V"+row;
    const mean6='IF(COUNT('+range+')=6,AVERAGE('+range+'),"")',outlierCount='IF('+q+'="","",SUMPRODUCT(--(ABS('+range+'-'+q+')>0.1*'+q+')))',excludedValue='IF('+rr+'=1,SUMPRODUCT(--(ABS('+range+'-'+q+')>0.1*'+q+'),'+range+'),"")',mean5='IF('+rr+'=1,(SUM('+range+')-'+s+')/5,"")',remainingOutliers='IF('+t+'="","",SUMPRODUCT(--(ABS('+range+'-'+q+')<=0.1*'+q+'),--(ABS('+range+'-'+t+')>0.1*'+t+')))';
    const finalAverage='IF(COUNT('+range+')=0,"",IF(COUNT('+range+')<6,"",IF(MIN('+range+')<=0,"",IF('+rr+'=0,'+q+',IF(AND('+rr+'=1,'+u+'=0),'+t+',"")))))';
    const qcStatus='IF(COUNT('+range+')=0,"",IF(COUNT('+range+')<6,"INCOMPLETE",IF(MIN('+range+')<=0,"CHECK INPUT",IF('+rr+'=0,"ACCEPTED - 6 RESULTS",IF(AND('+rr+'=1,'+u+'=0),"ACCEPTED - 1 EXCLUDED","REPEAT TEST")))))';
    const target=r.target===null?displayDate(r.dueDate)+" - Zero Time missing":"Target "+dateClock(r.target)+" | From "+dateClock(r.target-r.toleranceMin*60000)+" | To "+dateClock(r.target+r.toleranceMin*60000);
    const screenRow=screenRows[breakIndex],readingValues=screenRow?[...screenRow.querySelectorAll("[data-reading]")].map(x=>x.value):[],actualTime=screenRow?.querySelector('input[type="time"]')?.value||"",remarks=screenRow?.querySelector('input[type="text"]')?.value||"";
    const readingCells=Array.from({length:6},(_,i)=>{const raw=readingValues[i]??"",n=Number(raw);return raw!==""&&Number.isFinite(n)?xcell(n,S.cream):xcell("",S.cream)});
    const v=[xcell(r.status,S.body),xcell(r.age,S.body),xcell(r.log,S.body),xcell(productDisplay(r),S.body),xcell(r.mouldId||"-",S.body),xcell(previousAgeSummary(r),S.body),xcell(target,S.body),...readingCells,xformula(finalAverage,S.result),xformula(qcStatus,S.cream),xcell(actualTime,S.cream),xcell(remarks,S.cream),xformula(mean6,S.body),xformula(outlierCount,S.body),xformula(excludedValue,S.body),xformula(mean5,S.body),xformula(remainingOutliers,S.body)];
    rows.push(v);strengthRows.push(row);
  });else mergeRow(c.includeOverdue?"No strength breaks are due or overdue on this date.":"No strength breaks are due today.",S.note);
  rows.push([]);
  mergeRow("BS EN 196-1:2016: one three-compartment mould per test age; six compressive results per age. Apply the 10% rule in Clause 10.2.1. Earlier-age averages are reference values only. Test windows: 2D ±30 min; 7D ±2 h; 28D ±8 h.",S.note);
  addSignatureRow();
  return packageDailyWorkbook(dailyWorksheetXml(rows,merges,strengthRows,settingRows));
}
function download(data,type,name){const a=document.createElement("a"),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}

function renderActive(){if(!loaded)return setStatus("Select the approved tracker first.",true);const day=$("#date").value;if(!day)return setStatus("Select a date.",true);if(activeMode==="results")render(collectDay(loaded,day));else renderDaily(collectDaily(loaded,day,$("#includeOverdue").checked));$("#excel").textContent=activeMode==="results"?"Export Results Excel":"Export Daily Work Excel"}
function setMode(mode){activeMode=mode;$("#resultsMode").classList.toggle("active",mode==="results");$("#dailyMode").classList.toggle("active",mode==="daily");$("#dailyOptions").classList.toggle("hidden",mode!=="daily");$("#dateLabel").textContent=mode==="results"?"Results date":"Working date";$("#show").textContent=mode==="results"?"Show results":"Generate work sheet";if(loaded)renderActive();else{$("#report").classList.add("hidden");$("#dailyReport").classList.add("hidden");$("#actions").classList.add("hidden");setStatus(mode==="results"?"Select the approved tracker to view issued results.":"Select the approved tracker; today's work date will be selected automatically.")}}
$("#resultsMode").addEventListener("click",()=>setMode("results"));
$("#dailyMode").addEventListener("click",()=>setMode("daily"));
$("#file").addEventListener("change",async e=>{const file=e.target.files?.[0];if(!file)return;$("#show").disabled=true;$("#date").disabled=true;setStatus("Reading the tracker...");try{loaded=await loadSource(file);const d=$("#date"),today=localToday(),bounds=loaded.allDates;d.min=bounds[0]||"";d.removeAttribute("max");d.value=today;d.disabled=false;$("#show").disabled=false;renderActive()}catch(err){console.error(err);loaded=null;$("#report").classList.add("hidden");$("#dailyReport").classList.add("hidden");$("#actions").classList.add("hidden");setStatus("Could not read the file: "+esc(err.message),true)}});
$("#show").addEventListener("click",renderActive);
$("#date").addEventListener("change",()=>{if(loaded&&$("#date").value)renderActive()});
$("#includeOverdue").addEventListener("change",()=>{if(loaded&&activeMode==="daily")renderActive()});
$("#dailyReport").addEventListener("input",e=>{
  if(e.target.matches("[data-reading]"))updateStrengthRow(e.target.closest("[data-strength-row]"));
  if(e.target.closest("[data-setting-row]"))updateSettingRow(e.target.closest("[data-setting-row]"));
  const type=e.target.dataset.sign;if(type){signoff[type]=e.target.value;document.querySelectorAll(`[data-sign="${type}"]`).forEach(x=>{if(x!==e.target)x.value=e.target.value})}
});
$("#excel").addEventListener("click",()=>{if(!current)return;const daily=activeMode==="daily",data=daily?buildDailyWorkbook(current):buildCompactWorkbook(current),name=daily?`Daily_Physical_Work_${safeFile(current.day)}.xlsx`:`Physical_Test_Results_${safeFile(current.day)}.xlsx`;download(data,"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",name)});
$("#pdf").addEventListener("click",()=>{if(!current)return;$("#printPageStyle").textContent=activeMode==="daily"?"@page{size:A4 landscape;margin:8mm}":"@page{size:A4 portrait;margin:10mm}";window.print()});
window.__sigmaTest={loadSource,collectDay,collectDaily,compactGroups,strengthDevelopmentRows,productDisplay,evaluateStrengthResults,buildManagerWorkbook:buildCompactWorkbook,buildDailyWorkbook,dateKey,timeFraction};
